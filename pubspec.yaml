name: mobile_video_play
description: A Flutter SMB and Emby media browser and player.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  media_kit: ^1.2.6
  media_kit_libs_video: ^1.0.7
  media_kit_video: ^2.0.1
  shared_preferences: ^2.3.5
  screen_brightness: ^2.1.8
  smb_connect: ^0.0.9
  volume_controller: ^3.5.0
  get_thumbnail_video: ^0.7.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
